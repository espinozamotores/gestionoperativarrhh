<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Integrado de Gestión Operativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#F3F4F5; font-family:'IBM Plex Sans', system-ui, sans-serif; color:#14181C; }
  a { color:#10314F; }
  input, select, textarea, button { font-family:inherit; }
  h1,h2,h3 { font-family:'IBM Plex Serif', Georgia, serif; margin:0; }
  .layout { display:flex; flex-wrap:wrap; min-height:100vh; align-items:stretch; }
  .sidebar { width:250px; flex:0 1 250px; min-width:190px; background:#0B2239; color:#E9ECEF; padding:26px 18px; display:flex; flex-direction:column; gap:26px; }
  .sidebar nav button { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; cursor:pointer; padding:11px 12px; border-radius:2px; font-size:14.5px; font-weight:600; }
  .sidebar nav button:hover { background:#14314D; color:#fff; }
  .dot { width:6px; height:6px; display:inline-block; }
  main { flex:1 1 420px; min-width:0; padding:30px clamp(18px,3vw,40px) 60px; display:flex; flex-direction:column; gap:26px; }
  header.top { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; border-bottom:1px solid #DCE0E5; padding-bottom:22px; }
  .kicker { font-size:12.5px; letter-spacing:0.09em; text-transform:uppercase; color:#6E7883; font-weight:600; }
  .card { background:#FFFFFF; border:1px solid #DCE0E5; border-radius:2px; padding:22px; }
  .kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; }
  .kpi .card { padding:20px 22px; display:flex; flex-direction:column; gap:8px; }
  .kpi .val { font-family:'IBM Plex Serif', Georgia, serif; font-size:32px; font-weight:700; }
  .menuCards { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  .menuCards button { text-align:left; cursor:pointer; background:#fff; border:1px solid #DCE0E5; border-radius:2px; padding:22px; display:flex; flex-direction:column; gap:10px; }
  .menuCards button:hover { border-color:#1F6F5C; background:#F7F8F9; }
  label { display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:#414A54; }
  input[type=text], input[type=time], textarea { padding:11px 12px; border:1px solid #CDD3D9; border-radius:2px; font-size:14.5px; font-weight:400; color:#14181C; }
  .btn-primary { cursor:pointer; border:0; border-radius:2px; padding:12px; background:#10314F; color:#fff; font-size:14.5px; font-weight:600; }
  .btn-primary:hover { background:#0B2239; }
  .btn-outline { cursor:pointer; border:1px solid #CDD3D9; background:#fff; border-radius:2px; padding:12px 20px; font-size:14.5px; font-weight:600; color:#414A54; }
  .btn-outline:hover { border-color:#1F6F5C; color:#1F6F5C; }
  .row { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:12px 14px; border:1px solid #E7EAEE; border-radius:2px; background:#fff; }
  .pill { font-size:13px; font-weight:600; padding:5px 10px; border-radius:2px; }
  .flexcols { display:flex; flex-wrap:wrap; gap:22px; align-items:flex-start; }
  .col1 { flex:1 1 300px; min-width:280px; display:flex; flex-direction:column; gap:16px; }
  .col2 { flex:2 1 360px; min-width:280px; display:flex; flex-direction:column; gap:14px; }
  .muted { color:#8A939C; font-size:14px; }
  .sevbtn, .ptbtn { flex:1; cursor:pointer; padding:10px 0; border-radius:2px; border:1px solid #CDD3D9; background:#fff; color:#414A54; font-size:14.5px; font-weight:600; }
  .sevbtn.active, .ptbtn.active { background:#10314F; color:#fff; border-color:#10314F; }
  .ptbtn.active { background:#1F6F5C; border-color:#1F6F5C; }
  @media print { body * { visibility:hidden; } #reporte-pdf, #reporte-pdf * { visibility:visible; } #reporte-pdf { position:absolute; left:0; top:0; width:100%; } .no-print { display:none !important; } }
</style>
</head>
<body>
<div id="app" class="layout"></div>

<script>
const API = '/api/data';
const HORA_LIMITE = '09:00';
const UMBRAL_URGENCIA = 4;

const state = {
  view: 'menu',
  asistencia: [], quejas: [], opiniones: [],
  fAsisNombre: '', fAsisHora: '',
  fQuejaCliente: '', fQuejaTexto: '', fQuejaSev: 3,
  fOpiCliente: '', fOpiTexto: '', fOpiPuntaje: 4,
  asisMsg: '', reloj: '', periodo: 'dia', cargando: true
};

const sevLabels = {1:'Leve',2:'Menor',3:'Moderada',4:'Alta',5:'Crítica'};
const puntLabels = {1:'Muy insatisfecho',2:'Insatisfecho',3:'Neutral',4:'Satisfecho',5:'Muy satisfecho'};
const sevColor = n => n>=5 ? ['#F5EBE8','#8C2F2A'] : n===4 ? ['#F6F0E6','#8A5A20'] : n===3 ? ['#F2EFE4','#6E5A20'] : ['#EDEFF1','#4A5560'];
const toMin = h => Number(String(h).slice(0,2))*60 + Number(String(h).slice(3,5));
const fechaFmt = ts => new Date(ts).toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'});

async function apiGet(table) {
  const r = await fetch(`${API}?table=${table}`);
  return r.json();
}
async function apiPost(table, body) {
  const r = await fetch(`${API}?table=${table}`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  return r.json();
}
async function apiPatch(table, body) {
  const r = await fetch(`${API}?table=${table}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  return r.json();
}
async function apiDelete(table) {
  await fetch(`${API}?table=${table}`, {method:'DELETE'});
}

async function cargarTodo() {
  state.cargando = true; render();
  const [asis, quej, opi] = await Promise.all([apiGet('asistencia'), apiGet('quejas'), apiGet('opiniones')]);
  state.asistencia = asis; state.quejas = quej; state.opiniones = opi;
  state.cargando = false;
  render();
}

function setView(v) { state.view = v; state.asisMsg = ''; render(); }

async function marcar(tipo) {
  const nombre = (state.fAsisNombre || '').trim();
  if (!nombre) { state.asisMsg = 'Ingresa el nombre del colaborador.'; render(); return; }
  const hora = state.fAsisHora || state.reloj;
  let retraso = 0;
  if (tipo === 'ENTRADA') {
    const diff = toMin(hora) - toMin(HORA_LIMITE);
    if (diff > 0) retraso = diff;
  }
  const nuevo = await apiPost('asistencia', {nombre, tipo, hora, retraso});
  state.asistencia = [nuevo, ...state.asistencia];
  state.fAsisNombre = '';
  state.asisMsg = 'Registro guardado: ' + nombre + ' · ' + tipo + ' ' + hora + (retraso ? ' (retraso de ' + retraso + ' min)' : '');
  render();
}

async function registrarQueja() {
  const cliente = (state.fQuejaCliente || '').trim();
  const descripcion = (state.fQuejaTexto || '').trim();
  if (!cliente || !descripcion) return;
  const nueva = await apiPost('quejas', {cliente, descripcion, severidad: state.fQuejaSev});
  state.quejas = [...state.quejas, nueva].sort((a,b)=>b.severidad-a.severidad);
  state.fQuejaCliente=''; state.fQuejaTexto=''; state.fQuejaSev=3;
  render();
}

async function toggleQueja(id, resuelta) {
  const act = await apiPatch('quejas', {id, resuelta: !resuelta});
  state.quejas = state.quejas.map(q => q.id === id ? act : q);
  render();
}

async function guardarOpinion() {
  const cliente = (state.fOpiCliente || '').trim();
  if (!cliente) return;
  const comentario = (state.fOpiTexto || '').trim() || 'Sin comentario';
  const nueva = await apiPost('opiniones', {cliente, puntaje: state.fOpiPuntaje, comentario});
  state.opiniones = [nueva, ...state.opiniones];
  state.fOpiCliente=''; state.fOpiTexto=''; state.fOpiPuntaje=4;
  render();
}

async function vaciarTodo() {
  if (!confirm('¿Seguro que querés borrar todos los datos? Esta acción no se puede deshacer.')) return;
  await Promise.all([apiDelete('asistencia'), apiDelete('quejas'), apiDelete('opiniones')]);
  state.asistencia = []; state.quejas = []; state.opiniones = [];
  setView('menu');
}

function calcAsisAll() {
  return state.asistencia.map(r => {
    const estado = r.tipo !== 'ENTRADA' ? 'Salida registrada' : (r.retraso ? 'Retraso ' + r.retraso + ' min' : 'A tiempo');
    return {...r, estado};
  });
}

function viewMenu() {
  const asisAll = calcAsisAll();
  const tarde = asisAll.filter(r => r.retraso > 0);
  const pendientes = state.quejas.filter(q => !q.resuelta);
  const urgentes = pendientes.filter(q => q.severidad >= UMBRAL_URGENCIA);
  const prom = state.opiniones.length ? (state.opiniones.reduce((a,o)=>a+o.puntaje,0)/state.opiniones.length).toFixed(1) : '—';
  const kpis = [
    {label:'Marcaciones', value:String(asisAll.length), hint:tarde.length+' con retraso', color:'#10314F'},
    {label:'Quejas pendientes', value:String(pendientes.length), hint:urgentes.length+' urgentes', color:'#8A5A20'},
    {label:'Opiniones', value:String(state.opiniones.length), hint:'registradas', color:'#1F6F5C'},
    {label:'Satisfacción', value:String(prom), hint:'promedio sobre 5', color:'#1F6F5C'}
  ];
  const cards = [
    {title:'Asistencia (RRHH)', desc:'Entrada o salida, detección de llegada tarde y cálculo de retraso.', cta:'Registrar marcación →', view:'asistencia'},
    {title:'Quejas de clientes', desc:'Registro con severidad, ordenamiento automático y alertas urgentes.', cta:'Registrar queja →', view:'quejas'},
    {title:'Opiniones de clientes', desc:'Puntaje 1-5 y actualización del promedio de satisfacción.', cta:'Registrar opinión →', view:'opiniones'},
    {title:'Reportes', desc:'Informe consolidado con los indicadores de toda la operación.', cta:'Generar informe →', view:'reportes'}
  ];
  return `
    <div style="display:flex;flex-direction:column;gap:26px">
      <div class="kpi">${kpis.map(k=>`<div class="card"><div style="font-size:13px;color:#6E7883;font-weight:600">${k.label}</div><div class="val" style="color:${k.color}">${k.value}</div><div class="muted">${k.hint}</div></div>`).join('')}</div>
      <div class="menuCards">${cards.map(c=>`<button onclick="setView('${c.view}')"><div style="width:26px;height:3px;background:#1F6F5C"></div><div style="font-family:'IBM Plex Serif',serif;font-size:17px;font-weight:700">${c.title}</div><div class="muted" style="line-height:1.5">${c.desc}</div><div style="font-size:13.5px;font-weight:600;color:#10314F">${c.cta}</div></button>`).join('')}</div>
    </div>`;
}

function viewAsistencia() {
  const asisAll = calcAsisAll();
  return `
    <div class="flexcols">
      <section class="card col1">
        <h2 style="font-size:17px">Registrar marcación</h2>
        <label>Colaborador
          <input type="text" value="${state.fAsisNombre}" oninput="state.fAsisNombre=this.value" placeholder="Nombre y apellido">
        </label>
        <label>Hora de marcación
          <input type="time" value="${state.fAsisHora}" oninput="state.fAsisHora=this.value">
        </label>
        <div style="display:flex;gap:10px">
          <button class="btn-primary" style="flex:1" onclick="marcar('ENTRADA')">Entrada</button>
          <button class="btn-outline" style="flex:1;color:#10314F;border-color:#10314F" onclick="marcar('SALIDA')">Salida</button>
        </div>
        <div class="muted" style="border-top:1px solid #E7EAEE;padding-top:14px">Tolerancia de entrada: <strong style="color:#14181C">${HORA_LIMITE}</strong>. Después de esa hora el sistema calcula el retraso automáticamente.</div>
        ${state.asisMsg ? `<div style="font-size:13.5px;font-weight:600;color:#1F6F5C;background:#EEF4F1;border-radius:2px;padding:10px 12px">${state.asisMsg}</div>` : ''}
      </section>
      <section class="card col2">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
          <h2 style="font-size:17px">Registros guardados</h2>
          <span class="muted">${asisAll.length} marcaciones · ${asisAll.filter(r=>r.retraso>0).length} con retraso</span>
        </div>
        ${asisAll.length===0 ? '<div class="muted" style="padding:22px 0">Aún no hay marcaciones registradas.</div>' : ''}
        <div style="display:flex;flex-direction:column;gap:8px">
          ${asisAll.map(r=>`<div class="row">
            <span style="flex:1 1 150px;min-width:0;font-size:14.5px;font-weight:600">${r.nombre}</span>
            <span style="font-size:13.5px;color:#5A6672;font-weight:600">${r.tipo}</span>
            <span style="font-size:13.5px;color:#5A6672">${r.hora}</span>
            <span class="pill" style="background:${r.retraso>0?'#F6F0E6':'#EEF4F1'};color:${r.retraso>0?'#8A5A20':'#1F6F5C'}">${r.estado}</span>
          </div>`).join('')}
        </div>
      </section>
    </div>`;
}

function viewQuejas() {
  const pendientes = state.quejas.filter(q=>!q.resuelta);
  const urgentes = pendientes.filter(q=>q.severidad>=UMBRAL_URGENCIA);
  return `
    <div class="flexcols">
      <section class="card col1">
        <h2 style="font-size:17px">Registrar queja</h2>
        <label>Cliente
          <input type="text" value="${state.fQuejaCliente}" oninput="state.fQuejaCliente=this.value" placeholder="Nombre del cliente">
        </label>
        <label>Descripción
          <textarea rows="3" oninput="state.fQuejaTexto=this.value" placeholder="¿Qué ocurrió?">${state.fQuejaTexto}</textarea>
        </label>
        <div style="display:flex;flex-direction:column;gap:8px">
          <span style="font-size:13px;font-weight:600;color:#414A54">Severidad</span>
          <div style="display:flex;gap:8px">
            ${[1,2,3,4,5].map(n=>`<button class="sevbtn ${state.fQuejaSev===n?'active':''}" onclick="state.fQuejaSev=${n};render()">${n}</button>`).join('')}
          </div>
          <span class="muted">${state.fQuejaSev} · ${sevLabels[state.fQuejaSev]}</span>
        </div>
        <button class="btn-primary" onclick="registrarQueja()">Insertar y ordenar</button>
      </section>
      <section class="col2">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
            <h2 style="font-size:17px">Quejas urgentes</h2>
            <span class="muted">Severidad ${UMBRAL_URGENCIA} o superior</span>
          </div>
          ${urgentes.length===0?'<div class="muted">No hay quejas urgentes pendientes.</div>':''}
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
            ${urgentes.map(q=>`<div class="row" style="background:#FAF4F1;border-color:#E8D9D2;align-items:flex-start">
              <span class="pill" style="background:#F5EBE8;color:#8C2F2A">S${q.severidad}</span>
              <div><div style="font-weight:600">${q.cliente}</div><div class="muted" style="color:#5A6672">${q.descripcion}</div></div>
            </div>`).join('')}
          </div>
        </div>
        <div class="card" style="margin-top:18px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
            <h2 style="font-size:17px">Lista ordenada por severidad</h2>
            <span class="muted">${state.quejas.length} registradas · ${pendientes.length} pendientes</span>
          </div>
          ${state.quejas.length===0?'<div class="muted">Sin quejas registradas todavía.</div>':''}
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
            ${state.quejas.map(q=>{const c=sevColor(q.severidad);return `<div class="row">
              <span class="pill" style="background:${c[0]};color:${c[1]};flex:0 0 40px;text-align:center">${q.severidad}</span>
              <div style="flex:1 1 180px;min-width:0"><div style="font-weight:600">${q.cliente}</div><div class="muted">${q.descripcion}</div></div>
              <span style="font-size:13px;font-weight:600;color:${q.resuelta?'#1F6F5C':'#8A5A20'}">${q.resuelta?'Resuelta':'Pendiente'}</span>
              <button class="btn-outline" style="padding:7px 12px;font-size:13px" onclick="toggleQueja(${q.id}, ${q.resuelta})">${q.resuelta?'Reabrir':'Resolver'}</button>
            </div>`}).join('')}
          </div>
        </div>
      </section>
    </div>`;
}

function viewOpiniones() {
  const prom = state.opiniones.length ? (state.opiniones.reduce((a,o)=>a+o.puntaje,0)/state.opiniones.length).toFixed(1) : '—';
  const dist = [5,4,3,2,1].map(n=>{const c=state.opiniones.filter(o=>o.puntaje===n).length; return {n,count:c,pct:(state.opiniones.length?Math.round(c/state.opiniones.length*100):0)}});
  return `
    <div class="flexcols">
      <section class="card col1">
        <h2 style="font-size:17px">Registrar opinión</h2>
        <label>Cliente
          <input type="text" value="${state.fOpiCliente}" oninput="state.fOpiCliente=this.value" placeholder="Nombre del cliente">
        </label>
        <div style="display:flex;flex-direction:column;gap:8px">
          <span style="font-size:13px;font-weight:600;color:#414A54">Puntaje de satisfacción (1-5)</span>
          <div style="display:flex;gap:8px">
            ${[1,2,3,4,5].map(n=>`<button class="ptbtn ${state.fOpiPuntaje===n?'active':''}" onclick="state.fOpiPuntaje=${n};render()">${n}</button>`).join('')}
          </div>
          <span class="muted">${state.fOpiPuntaje} · ${puntLabels[state.fOpiPuntaje]}</span>
        </div>
        <label>Comentario
          <textarea rows="3" oninput="state.fOpiTexto=this.value" placeholder="Opcional">${state.fOpiTexto}</textarea>
        </label>
        <button class="btn-primary" style="background:#1F6F5C" onclick="guardarOpinion()">Guardar opinión</button>
      </section>
      <section class="col2">
        <div class="card" style="flex-direction:row;align-items:center;gap:26px;flex-wrap:wrap;display:flex">
          <div><div style="font-size:13px;font-weight:600;color:#6E7883">Promedio de satisfacción</div><div style="font-family:'IBM Plex Serif',serif;font-size:44px;font-weight:700;color:#1F6F5C">${prom}</div><div class="muted">sobre 5 · ${state.opiniones.length} opiniones</div></div>
          <div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:7px">
            ${dist.map(d=>`<div style="display:flex;align-items:center;gap:10px"><span style="width:14px;font-size:13px;font-weight:600">${d.n}</span><div style="flex:1;height:9px;border-radius:2px;background:#E7EAEE;overflow:hidden"><div style="height:100%;background:#1F6F5C;width:${d.pct}%"></div></div><span style="width:26px;text-align:right;font-size:13px;color:#8A939C">${d.count}</span></div>`).join('')}
          </div>
        </div>
        <div class="card" style="margin-top:18px">
          <h2 style="font-size:17px">Opiniones guardadas</h2>
          ${state.opiniones.length===0?'<div class="muted">Todavía no hay opiniones.</div>':''}
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
            ${state.opiniones.map(o=>`<div class="row" style="align-items:flex-start">
              <span class="pill" style="background:#EEF4F1;color:#1F6F5C;flex:0 0 40px;text-align:center">${o.puntaje}</span>
              <div><div style="font-weight:600">${o.cliente}</div><div class="muted">${o.comentario}</div></div>
            </div>`).join('')}
          </div>
        </div>
      </section>
    </div>`;
}

function viewReportes() {
  const asisAll = calcAsisAll();
  const dias = state.periodo === 'dia' ? 1 : state.periodo === 'semana' ? 7 : 30;
  const corte = Date.now() - dias*86400000;
  const idTime = r => r.creado ? new Date(r.creado).getTime() : Date.now();
  const pAsis = asisAll.filter(r=>idTime(r)>=corte);
  const pQuejas = state.quejas.filter(q=>idTime(q)>=corte);
  const pOpi = state.opiniones.filter(o=>idTime(o)>=corte);
  const pTarde = pAsis.filter(r=>r.retraso>0);
  const pPend = pQuejas.filter(q=>!q.resuelta);
  const pUrg = pPend.filter(q=>q.severidad>=UMBRAL_URGENCIA);
  const pProm = pOpi.length ? (pOpi.reduce((a,o)=>a+o.puntaje,0)/pOpi.length).toFixed(1) : '—';
  const pLabel = {dia:'diario',semana:'semanal',mes:'mensual'}[state.periodo];
  const minTarde = pTarde.reduce((a,r)=>a+r.retraso,0);
  const opts = [['dia','Diario'],['semana','Semanal'],['mes','Mensual']];
  return `
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="card no-print" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between">
        <div style="display:flex;flex-direction:column;gap:8px">
          <span style="font-size:13px;font-weight:600">Periodo del reporte</span>
          <div style="display:flex;gap:8px">${opts.map(([k,l])=>`<button class="btn-outline" style="${state.periodo===k?'background:#10314F;color:#fff;border-color:#10314F':''}" onclick="state.periodo='${k}';render()">${l}</button>`).join('')}</div>
        </div>
        <button class="btn-primary" onclick="window.print()">Exportar PDF</button>
      </div>
      <div class="kpi">
        ${[{l:'Llegadas tarde',v:pTarde.length,h:minTarde+' min de retraso',c:'#8A5A20'},{l:'Quejas pendientes',v:pPend.length,h:pUrg.length+' urgentes',c:'#8C2F2A'},{l:'Promedio satisfacción',v:pProm,h:pOpi.length+' opiniones',c:'#1F6F5C'},{l:'Marcaciones',v:pAsis.length,h:'entradas y salidas',c:'#10314F'}].map(k=>`<div class="card"><div style="font-size:13px;color:#6E7883;font-weight:600">${k.l}</div><div class="val" style="color:${k.c}">${k.v}</div><div class="muted">${k.h}</div></div>`).join('')}
      </div>
      <div id="reporte-pdf" class="card" style="display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid #0B2239;padding-bottom:14px">
          <div><span class="kicker">Recursos Humanos y Gestión de Clientes</span><h2 style="font-size:20px">Informe consolidado ${pLabel}</h2></div>
          <span style="font-size:13px;color:#5A6672">Generado el ${fechaFmt(Date.now())}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${[['Periodo del informe', pLabel.charAt(0).toUpperCase()+pLabel.slice(1)],['Marcaciones registradas', pAsis.length],['Llegadas tarde detectadas', pTarde.length+' ('+minTarde+' min)'],['Quejas totales / pendientes', pQuejas.length+' / '+pPend.length],['Quejas urgentes (severidad '+UMBRAL_URGENCIA+'+)', pUrg.length],['Opiniones registradas', pOpi.length],['Promedio de satisfacción', pProm+' / 5']].map(([l,v])=>`<div style="display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #E7EAEE"><span style="color:#414A54">${l}</span><span style="font-weight:700">${v}</span></div>`).join('')}
        </div>
        <div style="font-size:14px;color:#5A6672;line-height:1.6;background:#F5F6F7;border-radius:2px;padding:16px 18px">
          ${pPend.length||pTarde.length ? 'Prioriza '+pUrg.length+' queja(s) urgente(s) y revisa '+pTarde.length+' llegada(s) tarde con el equipo antes del próximo turno.' : 'Sin incidencias abiertas en el periodo: la operación se encuentra equilibrada.'}
        </div>
      </div>
    </div>`;
}

function viewSalir() {
  return `
    <div class="card" style="max-width:640px;display:flex;flex-direction:column;gap:16px">
      <div style="width:44px;height:3px;background:#1F6F5C"></div>
      <h2 style="font-size:24px">Sesión finalizada</h2>
      <p class="muted" style="font-size:15.5px;line-height:1.6">Se registraron ${state.asistencia.length} marcaciones, ${state.quejas.length} quejas y ${state.opiniones.length} opiniones.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-primary" onclick="setView('menu')">Volver al menú principal</button>
        <button class="btn-outline" style="border-color:#8C2F2A;color:#8C2F2A" onclick="vaciarTodo()">Vaciar todos los datos</button>
      </div>
    </div>`;
}

const navDefs = [
  ['menu','Menú principal','#94A3B1'],['asistencia','Asistencia (RRHH)','#6BA4D8'],
  ['quejas','Quejas clientes','#A9714B'],['opiniones','Opiniones clientes','#4E9683'],
  ['reportes','Reportes','#9A8248'],['salir','Salir','#8795A2']
];
const views = {
  menu:['Menú principal','Sistema Integrado de Gestión Operativa','Selecciona un módulo para iniciar el flujo de trabajo.'],
  asistencia:['Recursos Humanos','Control de asistencia','Registra entradas y salidas. El sistema calcula el retraso automáticamente.'],
  quejas:['Clientes','Quejas de clientes','Registra la queja; el sistema la ordena de mayor a menor severidad.'],
  opiniones:['Clientes','Opiniones y satisfacción','Registra el puntaje de 1 a 5; el promedio se actualiza al guardar.'],
  reportes:['Consolidado','Reportes','Informe con llegadas tarde, quejas pendientes y promedio de satisfacción.'],
  salir:['Cierre','Salir del sistema','']
};

function render() {
  const v = views[state.view];
  const body = state.cargando ? '<div class="muted" style="padding:40px">Cargando datos...</div>' :
    state.view==='menu' ? viewMenu() :
    state.view==='asistencia' ? viewAsistencia() :
    state.view==='quejas' ? viewQuejas() :
    state.view==='opiniones' ? viewOpiniones() :
    state.view==='reportes' ? viewReportes() : viewSalir();

  document.getElementById('app').innerHTML = `
    <aside class="sidebar">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="width:30px;height:3px;background:#6BA4D8"></div>
        <div style="font-family:'IBM Plex Serif',serif;font-weight:700;font-size:16px;line-height:1.25">Sistema Integrado<br>de Gestión Operativa</div>
        <div style="font-size:12.5px;color:#94A3B1;letter-spacing:0.04em;text-transform:uppercase">RR.HH. y Clientes</div>
      </div>
      <div style="border-top:1px solid #1C3550"></div>
      <nav>
        ${navDefs.map(([k,label,dot])=>`<button onclick="setView('${k}')" style="background:${state.view===k?'#14314D':'transparent'};color:${state.view===k?'#fff':'#C3CBD3'}"><span class="dot" style="background:${dot}"></span>${label}</button>`).join('')}
      </nav>
      <div style="margin-top:auto;font-size:12.5px;color:#8795A2;line-height:1.5">Los datos se guardan en la base de datos del servidor.</div>
    </aside>
    <main>
      <header class="top">
        <div style="display:flex;flex-direction:column;gap:6px">
          <span class="kicker">${v[0]}</span>
          <h1 style="font-size:29px">${v[1]}</h1>
          <p class="muted" style="max-width:62ch">${v[2]}</p>
        </div>
        <div style="display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #DCE0E5;border-radius:2px;padding:10px 14px">
          <span class="dot" style="background:#1F6F5C"></span>
          <span style="font-size:14px;color:#414A54;font-weight:600">${state.reloj || '--:--'}</span>
        </div>
      </header>
      ${body}
    </main>`;
}

function tick() {
  const d = new Date();
  state.reloj = d.toTimeString().slice(0,5);
  if (!state.fAsisHora) state.fAsisHora = state.reloj;
}

tick();
setInterval(()=>{tick(); render();}, 20000);
cargarTodo();
</script>
</body>
</html>
